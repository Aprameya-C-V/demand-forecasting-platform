[project]
name = "demand-forecasting-platform"
version = "1.0.0"
description = "Demand forecasting platform: automated training, serving, monitoring and retraining for NYC taxi demand."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.0",
    "httpx>=0.27.0",
    "lightgbm>=4.5.0",
    "numpy>=2.0.0",
    "polars>=1.10.0",
    "prometheus-client>=0.21.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.31.0",
]

[project.scripts]
forecast = "demand_forecast.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pip-audit>=2.10.1",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["demand_forecast"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
